name: Loot
version: ${project.version}
main: info.faceland.loot.LootPlugin
api-version: 1.20
depend:
  - Facecore
  - Strife
  - packetevents
  - GUIAPI
softdepend:
  - Vault
  - PlayerPoints
  - InteractiveChatDiscordSrvAddon
  - RecipeManager
  - RPGHealthAndFoods
  - HeadDatabase

commands:
  loot:
    aliases: [l]
  updateItem:
    aliases: [updat]

permissions:
  loot.give:
    default: op
  loot.reward:
    default: op